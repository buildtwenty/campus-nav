<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캠퍼스 건물 3D 안내</title>
<meta name="description" content="대학 건물의 출입구·엘리베이터·화장실·강의실 위치를 층별 3D로 보여주는 안내 지도">
<meta property="og:title" content="캠퍼스 건물 3D 안내">
<meta property="og:description" content="출입구·엘리베이터·화장실·강의실을 층별 3D로. 방 번호로 바로 찾기.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<style>
  :root {
    --bg0: #ffffff; --bg1: #e6ebf3; --text: #1b2430; --muted: #66727f; --border: rgba(20,30,50,0.08);
    --glass: rgba(255,255,255,0.82); --glass-strong: rgba(255,255,255,0.94); --shadow: 0 10px 34px rgba(20,30,50,0.14);
    --accent: #2f6fed; --accent-ink: #fff; --chip: #eef2f8;
    --wall: #9aa8bb; --slab: #e9eef5; --slab-active: #f7f9fc; --line: #55637a; --route: #ff5a36;
    --est: #9a6b00; --est-bg: #fff3d6; --ok: #2e9e5b;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg0: #141a23; --bg1: #0b0f15; --text: #e8edf4; --muted: #96a3b3; --border: rgba(255,255,255,0.08);
    --glass: rgba(24,31,41,0.80); --glass-strong: rgba(24,31,41,0.94); --shadow: 0 10px 34px rgba(0,0,0,0.45);
    --chip: #222b37; --wall: #7f90a8; --slab: #2a3341; --slab-active: #38424f; --line: #b7c3d3; --est-bg: #3a2e14; --est: #f0c674;
  } }
  :root[data-theme="dark"] { --bg0: #141a23; --bg1: #0b0f15; --text: #e8edf4; --muted: #96a3b3; --border: rgba(255,255,255,0.08); --glass: rgba(24,31,41,0.80); --glass-strong: rgba(24,31,41,0.94); --shadow: 0 10px 34px rgba(0,0,0,0.45); --chip: #222b37; --wall: #7f90a8; --slab: #2a3341; --slab-active: #38424f; --line: #b7c3d3; --est-bg: #3a2e14; --est: #f0c674; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { color: var(--text); font: 14px/1.45 Pretendard, -apple-system, system-ui, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
         background: radial-gradient(1400px 900px at 25% 15%, var(--bg0), var(--bg1)); -webkit-font-smoothing: antialiased; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
           border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: transparent; }
  .muted, small { color: var(--muted); }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .tag.est { background: var(--est-bg); color: var(--est); }
  .tag.type { color: #fff; }

  /* 상단: 건물 + 검색 */
  #top { position: fixed; left: 16px; top: 16px; width: 380px; max-width: calc(100% - 32px); padding: 10px 12px; z-index: 5; }
  #building { width: 100%; border: 0; background: transparent; font-weight: 700; font-size: 16px; padding: 2px 4px 8px; appearance: none; -webkit-appearance: none; cursor: pointer;
              background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
              background-position: calc(100% - 14px) 10px, calc(100% - 9px) 10px; background-size: 5px 5px; background-repeat: no-repeat; }
  .searchbox { display: flex; align-items: center; gap: 8px; background: var(--chip); border-radius: 12px; padding: 0 10px; height: 42px; }
  .searchbox svg { flex: none; opacity: 0.55; }
  #search { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15px; height: 100%; }
  #clear { width: 26px; height: 26px; border-radius: 50%; color: var(--muted); display: none; }
  #clear.on { display: block; }
  #results { list-style: none; margin: 8px 0 0; padding: 4px; max-height: 46vh; overflow: auto; border-radius: 12px; background: var(--glass-strong); border: 1px solid var(--border); }
  #results li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
  #results li:hover, #results li.on { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  #results li .no { font-weight: 700; min-width: 44px; }
  #results li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #results li small { flex: none; }
  #results li.empty { color: var(--muted); cursor: default; }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }

  /* 층 선택 알약 */
  #floors { position: fixed; right: 16px; top: 16px; z-index: 5; display: flex; flex-direction: column; padding: 6px; gap: 4px; }
  #floors button { min-width: 64px; padding: 8px 10px; border-radius: 10px; font-weight: 600; color: var(--muted); }
  #floors button:hover { background: var(--chip); color: var(--text); }
  #floors button.on { background: var(--accent); color: var(--accent-ink); }
  #floors button.sep { height: 1px; min-width: 0; padding: 0; margin: 2px 6px; background: var(--border); pointer-events: none; }

  /* 종류 칩 (필터) */
  #chips { position: fixed; left: 16px; bottom: 16px; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; max-width: min(620px, calc(100% - 32px)); }
  #chips button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--chip); font-weight: 600; font-size: 12.5px; color: var(--text); white-space: nowrap; flex: none; }
  #chips button.on { outline: 2px solid var(--accent); }
  #chips button i { width: 9px; height: 9px; border-radius: 3px; }

  /* 우하단 도구 */
  #tools { position: fixed; right: 16px; bottom: 16px; z-index: 5; display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 6px; }
  #tools button { padding: 7px 10px; border-radius: 10px; font-weight: 600; font-size: 12.5px; color: var(--muted); }
  #tools button:hover { background: var(--chip); color: var(--text); }
  #compass { width: 44px; height: 44px; margin: 2px auto; border-radius: 50%; background: var(--chip); display: grid; place-items: center; position: relative; }
  #compass svg { transition: transform 0.08s linear; }

  /* 카드 (방 정보 / 건물 정보) */
  #card { position: fixed; left: 16px; top: 112px; width: 380px; max-width: calc(100% - 32px); max-height: calc(100% - 200px); overflow: auto; z-index: 4; padding: 14px 16px; }
  #card h2 { margin: 0; font-size: 26px; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  #card h2 small { font-size: 13px; font-weight: 500; }
  #card .name { font-size: 16px; margin: 4px 0 8px; }
  #card .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  #card .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  #card .btns button, #card .btns a { padding: 8px 12px; border-radius: 10px; background: var(--chip); font-weight: 600; font-size: 13px; text-decoration: none; color: var(--text); }
  #card .btns .primary { background: var(--accent); color: var(--accent-ink); }
  #card .close { position: absolute; right: 10px; top: 10px; width: 30px; height: 30px; border-radius: 50%; color: var(--muted); font-size: 18px; }
  #card .close:hover { background: var(--chip); }
  #route { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  #route .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  #route select { flex: 1; min-width: 0; padding: 7px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--chip); }
  #route label { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #steps { margin: 8px 0 0; padding-left: 20px; }
  #steps li { margin: 4px 0; }
  #steps li.elevator::marker { color: #7b5ad6; } #steps li.stair::marker { color: #d9822b; }
  #facts { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; }
  #facts li.ok::marker { color: var(--ok); } #facts li.est::marker { color: var(--est); }
  details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* 모바일 */
  @media (max-width: 720px) {
    #top { left: 10px; top: 10px; width: calc(100% - 20px); padding: 8px 10px; }
    #floors { right: 10px; top: auto; bottom: 76px; flex-direction: row; max-width: calc(100% - 20px); overflow-x: auto; }
    #floors button { min-width: 54px; padding: 8px 8px; }
    #floors button.sep { width: 1px; height: auto; margin: 6px 2px; }
    #chips { left: 10px; bottom: 10px; max-width: calc(100% - 20px); flex-wrap: nowrap; overflow-x: auto; }
    #tools { display: none; }
    #card { left: 10px; right: 10px; width: auto; top: auto; bottom: 128px; max-height: 42vh; padding: 12px 14px; }
    #card h2 { font-size: 22px; }
  }
  body.embed #top, body.embed #chips, body.embed #tools { display: none; }
  body.embed #card { top: 16px; }
</style>
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="건물 3D 모형. 드래그로 회전, 휠로 확대"></canvas>

  <header id="top" class="glass">
    <select id="building" aria-label="건물 선택"></select>
    <div class="searchbox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="방 번호 · 이름 · 교수님 검색" autocomplete="off" enterkeyhint="search">
      <button id="clear" aria-label="지우기">×</button>
    </div>
    <ul id="results" hidden></ul>
  </header>

  <nav id="floors" class="glass" aria-label="층 선택"></nav>

  <aside id="card" class="glass" hidden></aside>

  <div id="chips" class="glass" aria-label="종류 필터"></div>

  <div id="tools" class="glass">
    <button data-view="iso">입체</button>
    <button data-view="top">위에서</button>
    <button data-view="side">옆에서</button>
    <div id="compass" title="북쪽"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 2 15.5 12 12 10.5 8.5 12z" fill="#e5484d"/><path d="M12 22 8.5 12 12 13.5 15.5 12z" fill="currentColor" opacity="0.35"/></svg></div>
    <button id="share">링크 복사</button>
    <a id="editLink" href="editor.html"><button type="button" style="width:100%">편집기</button></a>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
